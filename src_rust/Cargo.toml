[workspace]
resolver = "2"
members = [
    "rust_audio_core",
    "rust_tidal_core",
    "rust_ui",
    "rust_viz_core",
]

[workspace.package]
edition = "2021"
rust-version = "1.80"

[workspace.dependencies]
# Pinned shared deps so all crates resolve the same versions.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
parking_lot = "0.12"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# UI stack — only used by rust_ui but pinned here for visibility.
# gtk4-rs 0.11 binds to GTK 4.16+; libadwaita 0.9 is the matching companion;
# relm4 0.11 builds on this pair.
gtk4 = { version = "0.11", features = ["v4_12"] }
libadwaita = { version = "0.9", features = ["v1_5"] }
relm4 = { version = "0.11", features = ["libadwaita"] }
glib = "0.21"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
debug-assertions = false
overflow-checks = false
