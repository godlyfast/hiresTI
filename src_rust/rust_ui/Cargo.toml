[package]
name = "hiresti_ui"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true

[[bin]]
# Phase 1: keep distinct from `rust_launcher`'s `hiresti` binary so both
# coexist during the rewrite. Phase 11 cuts over: `rust_launcher` is
# retired and this binary is renamed to `hiresti`.
name = "hiresti_ui"
path = "src/main.rs"

[dependencies]
gtk4.workspace = true
libadwaita.workspace = true
relm4.workspace = true
glib.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
parking_lot.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

# In-workspace deps. Expose Tidal model types + Session directly so the
# UI can hand domain values around without re-serializing through JSON.
rust_tidal_core = { path = "../rust_tidal_core" }
rust_audio_core = { path = "../rust_audio_core" }
viz_core = { path = "../rust_viz_core" }

# Cover-art downloader. Same client shape rust_tidal_core uses, kept
# in the UI crate since covers are a UI-layer concern.
ureq = { version = "2", features = ["tls"], default-features = false }

# Linux system tray. KDE/freedesktop StatusNotifierItem via D-Bus —
# works on both X11 and Wayland. Use the blocking API so the dedicated
# tray thread doesn't pull a tokio runtime into the UI process.
ksni = { version = "0.3", default-features = false, features = ["blocking", "async-io"] }

# MPRIS2 media-player D-Bus interface so KDE/GNOME media keys + status
# bars can drive transport. Default features pull async-io (no tokio).
# Runs on its own thread with a smol/async-io block_on loop.
mpris-server = "0.10"
async-io = "2"
async-channel = "2"
futures-lite = "2"

# Scrobbler — Last.fm signing requires MD5; ListenBrainz is JSON-only
# but uses serde_json (already in workspace deps).
md-5 = "0.10"

# Direct zbus dep for the ALSA reserve service. mpris-server already
# pulls in the same major version transitively so cargo de-dupes;
# declaring it here keeps the import path stable independent of
# mpris-server's re-export shape.
zbus = { version = "5", default-features = false, features = ["async-io"] }
